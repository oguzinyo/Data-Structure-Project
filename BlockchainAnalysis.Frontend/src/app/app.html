<div style="position: relative; width: 100vw; height: 100vh; overflow: hidden; background-color: #070d1a;">

    <app-graph-engine [highlightedPath]="MehmetHighlight"
                      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
    </app-graph-engine>

    <div class="terminal-container" style="position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);">
        <header class="terminal-header">
            <div class="status-indicator"></div>
            <h2>Ağ İzleme Terminali</h2>
            <p class="subtitle">Fon Akışı ve Rota Tespit Modülü</p>
        </header>

        <div class="control-grid">
            <div class="input-group">
                <label>Kaynak Cüzdan (Örn: 0xA1B2)</label>
                <input type="text" #startInput placeholder="0x..." (input)="startWallet = startInput.value" class="modern-input">
            </div>

            <div class="input-group">
                <label>Hedef Cüzdan (Örn: 0xC3D4)</label>
                <input type="text" #targetInput placeholder="0x..." (input)="targetWallet = targetInput.value" class="modern-input">
            </div>
        </div>

        <div class="filter-section">
            <div class="slider-header">
                <label>Hacim Filtresi (Min)</label>
                <span class="badge">{{ MehmetMinAmount }} BTC</span>
            </div>
            <input type="range" min="0" max="5000" value="0" #amountSlider (input)="MehmetUpdateFilter(amountSlider.value)" class="modern-slider">
        </div>

        <div class="action-bar">
            <button class="btn-primary" (click)="MehmetFindPath()">Rotayı Parlat</button>
            <button class="btn-secondary" (click)="MehmetClear()">Temizle</button>
        </div>
    </div>
</div>
