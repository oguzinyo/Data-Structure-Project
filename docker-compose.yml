services:
  backend-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ummet_backend_service
    restart: unless-stopped
    stdin_open: true  # <--- Dışarıdan giriş (Enter vb.) beklemesini sağlar
    tty: true         # <--- Sanal bir terminal bağlayarak kapanmasını engeller
    networks:
      - ummet_blockchain_net

  frontend-app:
    build:
      context: ./BlockchainAnalysis.Frontend
      dockerfile: Dockerfile
    container_name: ummet_frontend_service
    restart: unless-stopped
    ports:
      - "4000:4000"
    networks:
      - ummet_blockchain_net
    depends_on:
      - backend-app

networks:
  ummet_blockchain_net:
    driver: bridge